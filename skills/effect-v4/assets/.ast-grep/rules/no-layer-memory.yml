# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: no-layer-memory
language: TypeScript
severity: error
message: "The generic `layerMemory` name is banned; say what it stores: `layerInMemoryStore` for a real in-memory adapter, or a free `layerFake<Service>` in test/ for a test-only fake."
note: |
  See the layer naming table in effect-v4 references/services-layers.md.
rule:
  any:
    - kind: identifier
      regex: "^layerMemory$"
    - kind: property_identifier
      regex: "^layerMemory$"
